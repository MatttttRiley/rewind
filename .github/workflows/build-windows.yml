name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download portable Tesseract OCR
        shell: pwsh
        run: |
          # UB Mannheim portable Tesseract build
          $url = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.5.0.20241111/tesseract-ocr-w64-setup-5.5.0.20241111.exe"
          Invoke-WebRequest -Uri $url -OutFile tesseract-setup.exe
          # silent install to a local dir, then keep the dir for bundling
          Start-Process -FilePath ".\tesseract-setup.exe" -ArgumentList "/VERYSILENT /DIR=`"${{ github.workspace }}\tesseract-bundle`"" -Wait

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --windowed --name Rewind --add-data "tesseract-bundle; tesseract" --hidden-import PIL --hidden-import mss --hidden-import pytesseract app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rewind-windows
          path: dist/Rewind.exe
